<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Anchour Voice Checker</title>
    <meta
      name="description"
      content="Score a piece of copy against Anchour's brand voice across six dimensions."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234452F5'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='20' fill='%23FFF3DF' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="site-header">
        <p class="eyebrow">Brand Voice Checker</p>
        <h1 class="headline">Does it sound like Anchour?</h1>
        <p class="lede">
          Paste any copy — a headline, an email, a social post — and score it
          against Anchour’s brand voice across six dimensions.
        </p>
      </header>

      <main>
        <form id="checker" class="input-card" novalidate>
          <label class="visually-hidden" for="copy">Copy to check</label>
          <textarea
            id="copy"
            name="copy"
            rows="6"
            maxlength="8000"
            placeholder="Flash in the pan, one-hit wonder — we’re not your marketing agency. We build for sustained growth…"
            autofocus
          ></textarea>
          <div class="input-row">
            <span class="counter" id="counter" aria-hidden="true">0 / 8000</span>
            <button type="submit" id="submit" class="btn">Check the voice</button>
          </div>
          <p class="error" id="error" role="alert" hidden></p>
        </form>

        <section id="results" class="results" aria-live="polite" hidden></section>
      </main>

      <footer class="site-footer">
        <p>
          Six dimensions from Anchour’s voice rubric. A pattern a short line
          can’t exhibit is marked <span class="na-inline">N/A</span>, not
          penalized.
        </p>
      </footer>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
