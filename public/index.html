<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Anchour Voice Checker</title>
    <meta
      name="description"
      content="Score a piece of copy against Anchour's brand voice across six dimensions."
    />

    <!-- Social share (Open Graph + Twitter). Absolute URLs use the production
         alias; update the host if the tool moves to a custom domain. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Anchour Voice Checker" />
    <meta
      property="og:description"
      content="Score a piece of copy against Anchour's brand voice across six dimensions."
    />
    <meta property="og:url" content="https://anchour-voice-checker.vercel.app/" />
    <meta property="og:image" content="https://anchour-voice-checker.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Anchour Voice Checker" />
    <meta
      name="twitter:description"
      content="Score a piece of copy against Anchour's brand voice across six dimensions."
    />
    <meta name="twitter:image" content="https://anchour-voice-checker.vercel.app/og.png" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="180x180" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="site-header">
        <p class="eyebrow">Brand Voice Checker</p>
        <h1 class="headline">Does it sound like Anchour?</h1>
        <p class="lede">
          Paste any copy — a headline, an email, a social post — and score it
          against Anchour’s brand voice across six dimensions.
        </p>
      </header>

      <main>
        <form id="checker" class="input-card" novalidate>
          <label class="visually-hidden" for="copy">Copy to check</label>
          <textarea
            id="copy"
            name="copy"
            rows="6"
            maxlength="8000"
            placeholder="Flash in the pan, one-hit wonder — we’re not your marketing agency. We build for sustained growth…"
            autofocus
          ></textarea>
          <div class="input-row">
            <span class="counter" id="counter" aria-hidden="true">0 / 8000</span>
            <button type="submit" id="submit" class="btn">Check the voice</button>
          </div>
          <p class="error" id="error" role="alert" hidden></p>
        </form>

        <section id="results" class="results" aria-live="polite" hidden></section>
      </main>

      <footer class="site-footer">
        <p>
          Six dimensions from Anchour’s voice rubric. A pattern a short line
          can’t exhibit is marked <span class="na-inline">N/A</span>, not
          penalized.
        </p>
      </footer>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
